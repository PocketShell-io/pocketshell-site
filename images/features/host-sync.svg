<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
<title>Host details encrypted locally before synchronization</title><desc>Three saved host rows connect to an encrypted data block. The illustrated sync arrow carries ciphertext.</desc>
